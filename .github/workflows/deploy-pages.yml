name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data & team continuity
        run: npm run check

      - name: Unit checks
        run: npm run test:unit

      # Fresh Fantrax data for every league's tabs, so a push never republishes
      # an old snapshot. `league:sync` takes ONE league per run and defaults to
      # Captains, so each league gets its own block — and each restores only its
      # OWN directories on failure: a single `git checkout -- src/data/fantrax
      # public/fantrax` would throw away a good Slapshot sync because Captains
      # failed. Order matters: Captains runs first and its restore is recursive,
      # so there is no fresh Slapshot data for it to discard; Slapshot's restore
      # names its own two directories, so its failure cannot undo the Captains
      # refresh above. Each sync also rebuilds its league's dynasty values
      # (Captains ~30 s after its snapshot; Slapshot ~1 min before its plan,
      # with its salary-cap contracts) and its check gates both. Non-fatal: on
      # failure that league's committed snapshot (already validated by
      # `npm run check` above) is restored and used.
      - name: Refresh Captains Dynasty snapshot (non-fatal)
        run: |
          # 10 min budget (a sync takes ~1 min): a hung read counts as a failure.
          if timeout 600 npm run league:sync -- --league captains-dynasty \
            && npm run check:league:captains; then
            echo "Captains Dynasty snapshot refreshed"
          else
            git checkout -- src/data/fantrax public/fantrax || true
            echo "::warning::captains-dynasty sync failed, using committed snapshot"
          fi

      - name: Refresh Slapshot snapshot (non-fatal)
        run: |
          if timeout 600 npm run league:sync -- --league slapshot \
            && npm run check:league:slapshot; then
            echo "Slapshot snapshot refreshed"
          else
            git checkout -- src/data/fantrax/slapshot public/fantrax/slapshot src/data/dynasty/slapshot/pool.json public/slapshot-draft.html || true
            echo "::warning::slapshot sync failed, using committed snapshot"
          fi

      # build:pages also regenerates public/slapshot-draft.html from the
      # dynasty.json being deployed (build-slapshot-draft-page.ts), so the
      # stand-alone draft page never lags the site's Repêchage tab.
      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
