name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data & team continuity
        run: npm run check

      - name: Unit checks
        run: npm run test:unit

      # Fresh Fantrax data for the Captains tabs, so a push never republishes
      # an old snapshot. The sync ends with the dynasty build (~30 s,
      # public/fantrax/dynasty.json) and check:league gates both. Non-fatal:
      # on any failure the committed snapshot and dynasty.json (already
      # validated by `npm run check` above) are restored and used.
      - name: Refresh league snapshot (non-fatal)
        run: |
          # 10 min budget (a sync takes ~1 min): a hung read counts as a failure.
          if timeout 600 npm run league:sync && npm run check:league; then
            echo "League snapshot refreshed"
          else
            git checkout -- src/data/fantrax public/fantrax || true
            echo "::warning::league sync failed, using committed snapshot"
          fi

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
