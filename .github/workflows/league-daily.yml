name: League daily refresh

# Re-syncs EVERY Fantrax league's snapshot (read-only: public fxea API plus
# unauthenticated fxpa reads, no login, <= 1 request/s) and redeploys Pages
# from a build artifact. One step per league, because `league:sync` takes one
# league per run and defaults to Captains: a single bare call left the second
# league's snapshot frozen at whatever was committed. Nothing is committed: pushes to master still deploy
# through deploy-pages.yml, which runs the same sync first.
#
# A scheduled run publishes whatever master HEAD is, so it runs the same
# gates as deploy-pages.yml first: a commit that failed them never goes live
# through the cron (and a push deploy this run replaces in the shared queue
# is not skipped past its checks).
on:
  schedule:
    # 11:40 EDT / 10:40 EST: after last night's finals, before matinees.
    - cron: "40 15 * * *"
    # 17:10 EDT / 16:10 EST: before the 19:00 locks, once goalies are announced.
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as deploy-pages.yml so the two never deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      # Includes the typecheck and the players.json / league snapshot guards.
      - name: Validate data & team continuity
        run: npm run check

      - name: Unit checks
        run: npm run test:unit

      # A failed sync fails the run: the site keeps the last good deploy
      # instead of republishing an older snapshot. The Captains sync ends with
      # the dynasty values (public/fantrax/dynasty.json, ~30 s); if only that
      # step fails, the committed dynasty.json ships and check:league says so.
      - name: Sync Captains Dynasty
        run: npm run league:sync -- --league captains-dynasty
        timeout-minutes: 10

      # Slapshot makes about the same handful of fxea calls, then runs its own
      # dynasty build (Slapshot profile with the salary cap, ~1 min) before its
      # plan, whose cap line reads the contracts that build derives.
      - name: Sync Slapshot
        run: npm run league:sync -- --league slapshot
        timeout-minutes: 10

      # Both leagues' snapshots and dynasty gates (Captains: schema, coverage of
      # every rostered player, K, ranks; Slapshot: schema, cap, λ, coverage).
      - name: Validate league snapshots
        run: npm run check:league

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
