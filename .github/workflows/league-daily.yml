name: League daily refresh

# Re-syncs EVERY Fantrax league's snapshot (read-only: public fxea API plus
# unauthenticated fxpa reads, no login, >= 1.1 s between requests) and
# redeploys Pages from a build artifact. One step per league, because
# `league:sync` takes one league per run and defaults to Captains: a single
# bare call left the second league's snapshot frozen at whatever was
# committed. Nothing is committed: pushes to master still deploy through
# deploy-pages.yml, which runs the same sync first.
#
# Each league's sync and its own check are NON-FATAL and independent, as in
# deploy-pages.yml: a league whose sync or check fails gets its committed
# snapshot back (restoring only its own files) and the run goes on, so a
# Slapshot failure never keeps the fresh Captains lineup advice from being
# deployed, and the reverse. Decision: a failed league ships master's
# committed snapshot (already validated by `npm run check` below), not the
# previous deploy's fresher one — the artifact of an earlier run is not
# kept, and the warning on the run says which league fell back.
#
# A scheduled run publishes whatever master HEAD is, so it runs the same
# gates as deploy-pages.yml first: a commit that failed them never goes live
# through the cron (and a push deploy this run replaces in the shared queue
# is not skipped past its checks).
on:
  schedule:
    # 11:40 EDT / 10:40 EST: after last night's finals, before matinees.
    - cron: "40 15 * * *"
    # 17:10 EDT / 16:10 EST: before the 19:00 locks, once goalies are announced.
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as deploy-pages.yml so the two never deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      # Includes the typecheck and the players.json / league snapshot guards.
      - name: Validate data & team continuity
        run: npm run check

      - name: Unit checks
        run: npm run test:unit

      # Captains: its snapshot, then its dynasty values (public/fantrax/
      # dynasty.json, ~30 s), gated by its own check (schema, coverage of
      # every rostered player, K, ranks). Captains runs first and its restore
      # is recursive (src/data/fantrax, public/fantrax), so there is no fresh
      # Slapshot data yet for it to discard.
      - name: Refresh Captains Dynasty snapshot (non-fatal)
        run: |
          # 10 min budget (a sync takes ~1 min): a hung read counts as a failure.
          if timeout 600 npm run league:sync -- --league captains-dynasty \
            && npm run check:league:captains; then
            echo "Captains Dynasty snapshot refreshed"
          else
            git checkout -- src/data/fantrax public/fantrax || true
            echo "::warning::captains-dynasty sync or check failed, using the committed snapshot"
          fi

      # Slapshot: about the same handful of fxea calls, then its own dynasty
      # build (salary cap, ~1 min) before its plan, whose cap line reads the
      # contracts that build derives, then its stand-alone draft page; gated by
      # its own check (schema, cap, λ, coverage). Its restore names only its
      # own files, so it cannot undo the Captains refresh above.
      - name: Refresh Slapshot snapshot (non-fatal)
        run: |
          if timeout 600 npm run league:sync -- --league slapshot \
            && npm run check:league:slapshot; then
            echo "Slapshot snapshot refreshed"
          else
            git checkout -- src/data/fantrax/slapshot public/fantrax/slapshot src/data/dynasty/slapshot/pool.json public/slapshot-draft.html || true
            echo "::warning::slapshot sync or check failed, using the committed snapshot"
          fi

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
